<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="focus-title focus-desc">
<title id="focus-title">Areas of focus</title>
<desc id="focus-desc">Automotive diagnostics and vehicle coding, digital resources and tools through KG Premium, and web and Discord community support.</desc>
<defs><linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#191e30"/><stop offset=".98" stop-color="#101421"/></linearGradient><linearGradient id="lead" x2="1"><stop stop-color="#a98fff"/><stop offset=".6" stop-color="#bfff83"/><stop offset="1" stop-color="#96cfff"/></linearGradient><linearGradient id="badge-surface" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#283047"/><stop offset=".5" stop-color="#192033"/><stop offset="1" stop-color="#101522"/>
</linearGradient>
<linearGradient id="badge-edge" x1="0" y1="0" x2="1" y2="1">
  <stop stop-color="#e6ecff" stop-opacity=".75"/><stop offset=".58" stop-color="#8f9fcb" stop-opacity=".14"/><stop offset="1" stop-color="#151929" stop-opacity="0"/>
</linearGradient></defs>
<style>.subject{font:650 23px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f2f5fb}.copy{font:16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#b6bfd7}.icon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.node{fill:currentColor;stroke:#151a27;stroke-width:1}.signal{transform-box:fill-box;transform-origin:center;animation:signal 6.2s ease-in-out infinite both}.phase-b{animation-delay:1.1s}.phase-c{animation-delay:2.2s}@keyframes signal{0%,54%,100%{opacity:.35;transform:scale(.75)}20%{opacity:1;transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){.signal{animation:none}}
@keyframes focus-glyph-depth {
  0%, 100% { transform: translate(0,0) scale(1); }
  52% { transform: translate(-.5px,-2px) scale(1.075); }
}
@keyframes focus-rim-light {
  0%, 100% { opacity: .34; }
  45% { opacity: .90; }
}
@keyframes focus-plane-light {
  0%, 100% { opacity: .20; transform: translateX(0); }
  52% { opacity: .92; transform: translateX(5px); }
}
@media (prefers-reduced-motion: no-preference) {
  .badge-glyph { transform-box: fill-box; transform-origin: center; animation: focus-glyph-depth 5.8s cubic-bezier(.26,.60,.32,1) var(--phase) infinite both; }
  .badge-rim { animation: focus-rim-light 5.8s ease-in-out var(--phase) infinite both; }
  .badge-plane { animation: focus-plane-light 6.8s ease-in-out var(--phase) infinite both; }
}
</style>
