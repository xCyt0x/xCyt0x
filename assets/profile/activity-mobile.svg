<style>
@keyframes trace-cycle{
  0%,100%{transform:translateX(0);opacity:.15}
  25%,75%{opacity:.58}
  50%{transform:translateX(var(--scan-travel));opacity:.16}
}
@keyframes lift-cycle{
  0%,8%,42%,100%{transform:translate(0,0)}
  19%{transform:translate(-.7px,-2.8px)}
  29%{transform:translate(-.3px,-.9px)}
  36%{transform:translate(0,.15px)}
}
@media (prefers-reduced-motion:no-preference){
  .scan{animation:trace-cycle 9.2s ease-in-out infinite}
  .tile-lift{animation:lift-cycle 9.2s ease-in-out infinite}
  .a0{animation-delay:1.25s}.a1{animation-delay:1.55s}.a2{animation-delay:1.9s}
}
</style>
