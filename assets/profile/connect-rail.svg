<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="60" viewBox="0 0 1100 60">
<style>
@keyframes signal { to { stroke-dashoffset: -240; } }
@keyframes drift { 50% { transform: translateX(40px); opacity: .74; } }
@keyframes glow { 50% { opacity: .30; } }
@keyframes sweep { 0%, 38% { transform: translateX(-260px); opacity: 0; } 47% { opacity: 1; } 78%, 100% { transform: translateX(610px); opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  .signal { animation: signal 6s linear infinite; }
  .drift { animation: drift 7s ease-in-out infinite; }
  .glow { animation: glow 4s ease-in-out infinite; }
  .sweep { animation: sweep 9s ease-in-out infinite; }
}
</style>
