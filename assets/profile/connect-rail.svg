<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="60" viewBox="0 0 1100 60">
<style>
@keyframes signal-rise {
  0% { stroke-dashoffset: var(--signal-start, 180); opacity: 0; }
  24%, 72% { opacity: 1; }
  100% { stroke-dashoffset: var(--signal-end, -130); opacity: 0; }
}
@keyframes node-rise {
  0%, 100% { opacity: .42; }
  52% { opacity: 1; }
}
@keyframes scan-across {
  0%, 12% { transform: translateX(-240px); opacity: 0; }
  28% { opacity: .7; }
  78%, 100% { transform: translateX(550px); opacity: 0; }
}
@keyframes orbit-arrive {
  from { stroke-dashoffset: 270; opacity: .04; }
  to { stroke-dashoffset: 0; opacity: .65; }
}
@media (prefers-reduced-motion: no-preference) {
  .signal { animation: signal-rise 7.6s cubic-bezier(.22,.65,.32,1) infinite both; }
  .glow { animation: node-rise 5.4s ease-in-out infinite both; }
  .drift { animation: node-rise 6.8s ease-in-out infinite both; }
  .sweep { animation: scan-across 8.4s ease-in-out infinite both; }
  .orbit-accent { animation: orbit-arrive 2.8s cubic-bezier(.2,.64,.33,1) both; }
}
</style>
<path d="M50 8h212l32 22h251m505-22H838l-32 22H555M50 52h212l32-22m756 22H838l-32-22" fill="none" stroke="#6f76a2" stroke-width="2" stroke-opacity=".73"/>
<path class="signal" d="M50 8h212l32 22h251m505-22H838l-32 22H555M50 52h212l32-22m756 22H838l-32-22" fill="none" stroke="#c7ff87" stroke-width="2.8" stroke-dasharray="24 216" stroke-linecap="round"/>
<circle cx="550" cy="30" r="12" fill="#181e2b" stroke="#656e92"/><circle class="glow" cx="550" cy="30" r="4" fill="#c7ff87"/>
<circle cx="50" cy="8" r="4" fill="#c7ff87"/><circle cx="1050" cy="8" r="4" fill="#a0c6ff"/><circle cx="50" cy="52" r="4" fill="#f9a9d7"/><circle cx="1050" cy="52" r="4" fill="#ffbc8b"/>
</svg>
