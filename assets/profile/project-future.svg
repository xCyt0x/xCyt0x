<svg xmlns="http://www.w3.org/2000/svg" width="550" height="160" viewBox="0 0 550 160">
<title>In exploration — New areas · pre-launch</title>
<defs>
  <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#1b2130"/><stop offset=".55" stop-color="#131828"/><stop offset="1" stop-color="#0c101b"/></linearGradient>
  <radialGradient id="violet"><stop stop-color="#6750c9" stop-opacity=".40"/><stop offset="1" stop-color="#6750c9" stop-opacity="0"/></radialGradient>
  <radialGradient id="mint"><stop stop-color="#60bd78" stop-opacity=".20"/><stop offset="1" stop-color="#60bd78" stop-opacity="0"/></radialGradient>
  <linearGradient id="word" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#c7cbe7"/></linearGradient>
  <linearGradient id="shine"><stop stop-color="#bfff83" stop-opacity="0"/><stop offset=".50" stop-color="#d5ffad" stop-opacity=".55"/><stop offset="1" stop-color="#bfff83" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#838aac" stroke-opacity=".13"/></pattern>
  <clipPath id="frame"><rect width="550" height="160" rx="25"/></clipPath>
</defs>
<style>
@keyframes signal-rise {
  0% { stroke-dashoffset: var(--signal-start, 180); opacity: 0; }
  24%, 72% { opacity: 1; }
  100% { stroke-dashoffset: var(--signal-end, -130); opacity: 0; }
}
@keyframes node-rise {
  0%, 100% { opacity: .42; }
  52% { opacity: 1; }
}
@keyframes scan-across {
  0%, 12% { transform: translateX(-240px); opacity: 0; }
  28% { opacity: .7; }
  78%, 100% { transform: translateX(550px); opacity: 0; }
}
@keyframes orbit-arrive {
  from { stroke-dashoffset: 270; opacity: .04; }
  to { stroke-dashoffset: 0; opacity: .65; }
}
@media (prefers-reduced-motion: no-preference) {
  .signal { animation: signal-rise 7.6s cubic-bezier(.22,.65,.32,1) infinite both; }
  .glow { animation: node-rise 5.4s ease-in-out infinite both; }
  .drift { animation: node-rise 6.8s ease-in-out infinite both; }
  .sweep { animation: scan-across 8.4s ease-in-out infinite both; }
  .orbit-accent { animation: orbit-arrive 2.8s cubic-bezier(.2,.64,.33,1) both; }
}
</style>
<g clip-path="url(#frame)">
  <rect width="550" height="160" fill="url(#surface)"/>
  <ellipse cx="468" cy="57" rx="230" ry="125" fill="url(#violet)" opacity="0.75"/>
 <g stroke="#baadff" stroke-opacity=".18" fill="none" stroke-width="1.6"><circle cx="435" cy="72" r="29"/><circle cx="435" cy="72" r="44" stroke-dasharray="2 6"/><path d="M390 72h90m-45-45v90m0-45 31-28"/></g>
 <rect x="375" width="175" height="160" fill="url(#grid)"/>
 <path d="M438 16h83v10m0 114v10h-36" fill="none" stroke="#aca6d4" stroke-opacity=".42"/>
 <circle cx="528" cy="131" r="2" fill="#bbacf2" fill-opacity=".65"/>
 <path d="M0 23Q0 0 23 0h67" fill="none" stroke="#baadff" stroke-width="3"/>
 <path d="M0 144h97l14-11h100m148 0h74l12-11h105" fill="none" stroke="#baadff" stroke-opacity=".24" stroke-width="1.4"/>
 <path class="signal" style="animation-delay:.28s" d="M0 144h97l14-11h100m148 0h74l12-11h105" fill="none" stroke="#baadff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="26 214"/>
 <rect x="26" y="49" width="62" height="62" rx="14" fill="#baadff" fill-opacity=".11" stroke="#baadff" stroke-opacity=".45"/>
 <g transform="translate(43 66) scale(1.17)" fill="none" stroke="#baadff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="m12 12 7-7M12 1v2M23 12h-2M12 23v-2M1 12h2"/></g>
 <text x="110" y="78" fill="#f2f5fb" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="750">In exploration</text>
 <text x="112" y="119" fill="#b0bad3" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">New areas · pre-launch</text>
 <circle class="glow" cx="502" cy="65" r="8" fill="#baadff" opacity=".76"/><circle cx="502" cy="65" r="17" fill="none" stroke="#baadff" opacity=".42"/>
</g>
<rect x="1" y="1" width="548" height="158" rx="24" fill="none" stroke="#535b76" stroke-width="2"/>
</svg>
