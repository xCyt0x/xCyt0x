<svg xmlns="http://www.w3.org/2000/svg" width="550" height="111" viewBox="0 0 550 111">
<title>Instagram</title>
<defs>
  <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#1b2130"/><stop offset=".55" stop-color="#131828"/><stop offset="1" stop-color="#0c101b"/></linearGradient>
  <radialGradient id="violet"><stop stop-color="#6750c9" stop-opacity=".40"/><stop offset="1" stop-color="#6750c9" stop-opacity="0"/></radialGradient>
  <radialGradient id="mint"><stop stop-color="#60bd78" stop-opacity=".20"/><stop offset="1" stop-color="#60bd78" stop-opacity="0"/></radialGradient>
  <linearGradient id="word" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#c7cbe7"/></linearGradient>
  <linearGradient id="shine"><stop stop-color="#bfff83" stop-opacity="0"/><stop offset=".50" stop-color="#d5ffad" stop-opacity=".55"/><stop offset="1" stop-color="#bfff83" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#838aac" stroke-opacity=".13"/></pattern>
  <clipPath id="frame"><rect width="550" height="111" rx="25"/></clipPath>
</defs>
<style>
@keyframes signal-rise {
  0% { stroke-dashoffset: var(--signal-start, 180); opacity: 0; }
  24%, 72% { opacity: 1; }
  100% { stroke-dashoffset: var(--signal-end, -130); opacity: 0; }
}
@keyframes node-rise {
  0%, 100% { opacity: .42; }
  52% { opacity: 1; }
}
@keyframes scan-across {
  0%, 12% { transform: translateX(-240px); opacity: 0; }
  28% { opacity: .7; }
  78%, 100% { transform: translateX(550px); opacity: 0; }
}
@keyframes orbit-arrive {
  from { stroke-dashoffset: 270; opacity: .04; }
  to { stroke-dashoffset: 0; opacity: .65; }
}
@media (prefers-reduced-motion: no-preference) {
  .signal { animation: signal-rise 3.55s cubic-bezier(.22,.65,.32,1) both; }
  .glow { animation: node-rise 2.15s ease-in-out both; }
  .drift { animation: node-rise 3.6s ease-in-out both; }
  .sweep { animation: scan-across 4.1s ease-out both; }
  .orbit-accent { animation: orbit-arrive 2.8s cubic-bezier(.2,.64,.33,1) both; }
}
</style>
<g clip-path="url(#frame)">
  <rect width="550" height="111" fill="url(#surface)"/>
  <ellipse cx="468" cy="57" rx="230" ry="125" fill="url(#violet)" opacity="0.38"/>
 <rect x="375" width="175" height="111" fill="url(#grid)"/>
 <path d="M438 16h83v10m0 65v10h-36" fill="none" stroke="#aca6d4" stroke-opacity=".42"/>
 <circle cx="528" cy="82" r="2" fill="#bbacf2" fill-opacity=".65"/>
 <path d="M0 23Q0 0 23 0h67" fill="none" stroke="#f9a9d7" stroke-width="3"/>
 <path d="M0 95h97l14-11h100m148 0h74l12-11h105" fill="none" stroke="#f9a9d7" stroke-opacity=".24" stroke-width="1.4"/>
 <path class="signal" style="animation-delay:.57s" d="M0 95h97l14-11h100m148 0h74l12-11h105" fill="none" stroke="#f9a9d7" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="26 214"/>
 <rect x="26" y="25" width="62" height="62" rx="14" fill="#f9a9d7" fill-opacity=".11" stroke="#f9a9d7" stroke-opacity=".45"/>
 <g transform="translate(43 43) scale(1.17)" fill="none" stroke="#f9a9d7" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></g>
 <text x="110" y="69" fill="#f2f5fb" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="750">Instagram</text>
 
 <path d="M482 67l31-31m-22 0h22v22" fill="none" stroke="#f9a9d7" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x="1" y="1" width="548" height="109" rx="24" fill="none" stroke="#535b76" stroke-width="2"/>
</svg>
