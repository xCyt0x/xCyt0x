<svg xmlns="http://www.w3.org/2000/svg" width="550" height="160" viewBox="0 0 550 160" role="img">
<title>Factorasion · Private beta · In development</title>
<defs>
  <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#163039"/><stop offset=".55" stop-color="#10252d"/><stop offset="1" stop-color="#0b1821"/></linearGradient>
  <radialGradient id="violet"><stop stop-color="#168574" stop-opacity=".40"/><stop offset="1" stop-color="#168574" stop-opacity="0"/></radialGradient>
  <radialGradient id="mint"><stop stop-color="#60bd78" stop-opacity=".20"/><stop offset="1" stop-color="#60bd78" stop-opacity="0"/></radialGradient>
  <linearGradient id="word" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#c7cbe7"/></linearGradient>
  <linearGradient id="shine"><stop stop-color="#bfff83" stop-opacity="0"/><stop offset=".50" stop-color="#d5ffad" stop-opacity=".55"/><stop offset="1" stop-color="#bfff83" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="#82b5bb" stroke-opacity=".13"/></pattern>
  <clipPath id="frame"><rect width="550" height="160" rx="25"/></clipPath>
</defs>
<style>
@keyframes signal-rise {
  0% { stroke-dashoffset: var(--signal-start, 180); opacity: 0; }
  24%, 72% { opacity: 1; }
  100% { stroke-dashoffset: var(--signal-end, -130); opacity: 0; }
}
@keyframes node-rise {
  0%, 100% { opacity: .42; }
  52% { opacity: 1; }
}
@keyframes scan-across {
  0%, 12% { transform: translateX(-240px); opacity: 0; }
  28% { opacity: .7; }
  78%, 100% { transform: translateX(550px); opacity: 0; }
}
@keyframes orbit-arrive {
  from { stroke-dashoffset: 270; opacity: .04; }
  to { stroke-dashoffset: 0; opacity: .65; }
}
@media (prefers-reduced-motion: no-preference) {
  .signal { animation: signal-rise 7.6s cubic-bezier(.22,.65,.32,1) infinite both; }
  .glow { animation: node-rise 5.4s ease-in-out infinite both; }
  .drift { animation: node-rise 6.8s ease-in-out infinite both; }
  .sweep { animation: scan-across 8.4s ease-in-out infinite both; }
  .orbit-accent { animation: orbit-arrive 2.8s cubic-bezier(.2,.64,.33,1) both; }
}
</style>
<g clip-path="url(#frame)">
  <rect width="550" height="160" fill="url(#surface)"/>
  <ellipse cx="468" cy="57" rx="230" ry="125" fill="url(#violet)" opacity="0.75"/>
 <g stroke="#8af2d6" stroke-opacity=".18" fill="none" stroke-width="1.6"><path d="M451 31h34l14 14v66l-7-5-7 5-7-5-7 5-7-5-6 5V40a9 9 0 0 1 9-9m17 0v14h15m-31 13h20m-20 13h20m-20 13h13"/></g>
 <rect x="375" width="175" height="160" fill="url(#grid)"/>
 <path d="M438 16h83v10m0 114v10h-36" fill="none" stroke="#91c3bf" stroke-opacity=".42"/>
 <circle cx="528" cy="131" r="2" fill="#97dac9" fill-opacity=".65"/>
 <path d="M0 23Q0 0 23 0h67" fill="none" stroke="#8af2d6" stroke-width="3"/>
 <path d="M0 144h97l14-11h100m148 0h74l12-11h105" fill="none" stroke="#8af2d6" stroke-opacity=".24" stroke-width="1.4"/>
 <path class="signal" style="animation-delay:.28s" d="M0 144h97l14-11h100m148 0h74l12-11h105" fill="none" stroke="#8af2d6" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="26 214"/>
 <rect x="26" y="49" width="62" height="62" rx="14" fill="#d9f5ec" stroke="#8af2d6" stroke-opacity=".62"/>
 <image x="35" y="58" width="44" height="44" href="data:image/png;base64,"/>
 <text x="110" y="78" fill="#f2f5fb" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="750">Factorasion</text>
 <text x="112" y="119" fill="#b4cfce" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Private beta · In development</text>
 <circle class="glow" cx="502" cy="65" r="8" fill="#8af2d6" opacity=".76"/><circle cx="502" cy="65" r="17" fill="none" stroke="#8af2d6" opacity=".42"/>
</g>
<rect x="1" y="1" width="548" height="158" rx="24" fill="none" stroke="#3b6068" stroke-width="2"/>
</svg>
