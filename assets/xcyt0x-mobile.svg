<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390">
  <title>xCyt0x — BMW diagnostics and vehicle coding</title>
  <defs>
    <linearGradient id="base" x2="1" y2="1">
      <stop stop-color="#0b1726"/><stop offset="1" stop-color="#060e19"/>
    </linearGradient>
    <radialGradient id="aura" cx=".78" cy=".53" r=".57">
      <stop stop-color="#17405a"/><stop offset="1" stop-color="#102537" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x2=".8" y2="1">
      <stop stop-color="#243f55"/><stop offset="1" stop-color="#0d1927"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
