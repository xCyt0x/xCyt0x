    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="940" cy="160" r="250" fill="url(#glow)"/>
    <circle cx="1090" cy="340" r="300" fill="url(#glow2)"/>
    <path d="M0 0H1200V380H0Z" fill="none" stroke="#8bb7c8" stroke-opacity=".19" stroke-width="2"/>

