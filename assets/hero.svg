<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">xCyt0x</title>
  <desc id="desc">A dark, luminous profile banner with a geometric orbit and the phrase exploring, building, refining.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111a"/>
