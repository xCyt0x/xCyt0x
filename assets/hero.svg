      <text x="59" y="270" font-size="21" font-weight="500" letter-spacing="1.7" fill="#b9cbd8">exploring <tspan fill="#6be9d7">/</tspan> building <tspan fill="#6be9d7">/</tspan> refining</text>
      <text x="60" y="321" font-size="12" font-weight="600" letter-spacing="3.1" fill="#829fb2">A LITTLE CURIOSITY GOES A LONG WAY</text>
