      <rect x="58" y="48" width="216" height="34" rx="17" fill="#142a34" stroke="#61d6c9" stroke-opacity=".45"/>
      <circle cx="78" cy="65" r="4" fill="#72f8de"/>
      <text x="94" y="70" font-size="12" font-weight="700" letter-spacing="2.4" fill="#b9e9e3">WELCOME TO MY SPACE</text>

